    function onRuleTypeChange() {
      const t = document.getElementById('rule-type').value;
      document.getElementById('box-trigger-dev').classList.toggle('hidden', t === 'schedule');
      document.getElementById('box-trigger-metric').classList.toggle('hidden', t === 'schedule');
      document.getElementById('box-schedule-time').classList.toggle('hidden', t !== 'schedule');
    }

    function parseActionValue(rawStr) {
      const s = String(rawStr).trim().toLowerCase();
      if (s === 'true' || s === 'on' || s === 'вкл') return true;
      if (s === 'false' || s === 'off' || s === 'выкл') return false;
      const num = parseFloat(rawStr);
      if (!isNaN(num)) return num;
      return rawStr.trim();
    }

    async function testActionOnce() {
      const action_device_id = document.getElementById('rule-act-dev').value;
      const action_code = document.getElementById('rule-act-code').value;
      let action_value = parseActionValue(document.getElementById('rule-act-val').value);
      if (!action_device_id) return;
      const dev = allDevices.find(d => d.device_id === action_device_id);
      if (action_code === 'temp_set' && typeof action_value === 'number' && action_value <= 50 && dev?.category === 'wk') {
        action_value = Math.round(action_value * 10);
      }
      await sendCommand(action_device_id, action_code, null, action_value);
    }

    async function saveCustomRule() {
      const name = document.getElementById('rule-name').value.trim() || 'Правило';
      const rule_type = document.getElementById('rule-type').value;
      const trigger_device_id = document.getElementById('rule-trig-dev').value;
      const trigger_metric = document.getElementById('rule-trig-metric').value;
      const operator = document.getElementById('rule-op').value;
      const threshold = parseFloat(document.getElementById('rule-thresh').value) || 2.0;
      const schedule_time = document.getElementById('rule-time').value || '23:00';
      const action_device_id = document.getElementById('rule-act-dev').value;
      const action_code = document.getElementById('rule-act-code').value;
      const action_value = parseActionValue(document.getElementById('rule-act-val').value);

      if (!action_device_id) return;

      await safeFetchJson('/api/automations', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          id: 0, profile_id: profilesData.active, name, enabled: true, rule_type,
          trigger_device_id: trigger_device_id || action_device_id,
          trigger_metric, operator, threshold, schedule_time,
          action_device_id, action_code, action_value
        })
      });
      await loadAllData(false);
    }

    async function toggleRule(id, enabled) {
      await safeFetchJson(`/api/automations/${id}/toggle`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ enabled })
      });
      await loadAllData(false);
    }

    async function deleteRule(id) {
      await safeFetchJson(`/api/automations/${id}`, { method: 'DELETE' });
      await loadAllData(false);
    }

    function renderAutomationsTab() {
      const rules = automationsData.rules || [];
      const logs = automationsData.logs || [];
      document.getElementById('rules-count').innerText = rules.length;

      const trigSelect = document.getElementById('rule-trig-dev');
      const actSelect = document.getElementById('rule-act-dev');
      const smartDevs = allDevices.filter(d => !String(d.vendor).startsWith('Camera'));

      if (trigSelect && trigSelect.options.length !== allDevices.length) {
        trigSelect.innerHTML = allDevices.map(d => `<option value="${d.device_id}">${d.name || d.device_id}</option>`).join('');
      }
      if (actSelect && actSelect.options.length !== smartDevs.length) {
        actSelect.innerHTML = smartDevs.map(d => `<option value="${d.device_id}">${d.name || d.device_id}</option>`).join('');
      }

      const listEl = document.getElementById('rules-list');
      listEl.innerHTML = rules.map(r => {
        const trigDev = allDevices.find(d => d.device_id === r.trigger_device_id)?.name || r.trigger_device_id;
        const actDev = allDevices.find(d => d.device_id === r.action_device_id)?.name || r.action_device_id;
        const condText = r.rule_type === 'schedule'
          ? `В <b>${r.schedule_time}</b>`
          : `<b>${trigDev}</b> ${r.operator === 'lt' ? '<' : '>'} ${r.threshold}`;

        return `<div class="rule-row">
          <div>
            <div style="font-weight:700; font-size:14px;">${r.name}</div>
            <div style="font-size:12px; color:var(--text-muted);">${condText} ➔ <b>${actDev}</b> (${r.action_value})</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <label class="switch">
              <input type="checkbox" ${r.enabled ? 'checked' : ''} onchange="toggleRule(${r.id}, this.checked)">
              <span class="slider"></span>
            </label>
            <button class="btn btn-danger" style="padding:4px 8px;" onclick="deleteRule(${r.id})">✕</button>
          </div>
        </div>`;
      }).join('');

      const logsEl = document.getElementById('auto-logs-box');
      if (logs.length > 0) {
        logsEl.innerHTML = logs.map(l => `
          <div style="padding:4px 0; border-bottom:1px solid var(--border);">
            <b>[${l.time_str}] ${l.rule_name}:</b> ${l.message}
          </div>
        `).join('');
      }
    }

    async function loadRemoteConfigUi() {
      try {
        remoteConfigData = await safeFetchJson('/api/remote/config');
        const urlInput = document.getElementById('rem-vps-url');
        if (urlInput && document.activeElement !== urlInput) {
          urlInput.value = remoteConfigData.vps_url || '';
        }
        renderRemoteSummaryBox();
      } catch (_) {}
    }

    function renderRemoteSummaryBox() {
      const net = (profilesData && profilesData.network) || (remoteConfigData && remoteConfigData.network) || {};
      const d = profilesData.diagnostics || {};
      const hubId = (remoteConfigData && remoteConfigData.hub_id) || '';
      const w = net.wifi || null;

      const badgeEl = document.getElementById('hub-id-badge');
      if (badgeEl) badgeEl.innerText = hubId;

      const box = document.getElementById('remote-net-summary');
      if (box) {
        box.innerHTML = `
          <div class="net-card">
            <div style="font-size:11px; color:var(--text-muted); font-weight:700;">УСТРОЙСТВА И КЛЮЧИ</div>
            <div style="font-size:13.5px; font-weight:700; margin-top:3px;">
              В LAN: ${d.lan_devices || 0} из ${d.total_devices || 0} • Ключей: ${d.configured_keys || 0}
            </div>
          </div>
          ${w ? `
          <div class="net-card">
            <div style="font-size:11px; color:var(--text-muted); font-weight:700;">WI-FI (${w.ssid})</div>
            <div style="font-size:13.5px; font-weight:700; color:${w.quality_grade === 'good' ? 'var(--success)' : 'var(--warning)'}; margin-top:3px;">
              ${w.verdict}
            </div>
          </div>` : ''}
          <div class="net-card">
            <div style="font-size:11px; color:var(--text-muted); font-weight:700;">STUN / P2P</div>
            <div style="font-size:13.5px; font-weight:700; margin-top:3px;">${net.stun_public_endpoint || '—'}</div>
          </div>
          <div class="net-card">
            <div style="font-size:11px; color:var(--text-muted); font-weight:700;">VPS КАНАЛ</div>
            <div style="font-size:13.5px; font-weight:700; color:${net.vps_relay_connected ? 'var(--success)' : 'var(--warning)'}; margin-top:3px;">
              ${net.vps_relay_connected ? 'Подключен' : 'Нет связи'}
            </div>
          </div>
        `;
      }

      const cloudBox = document.getElementById('cloud-keys-status-box');
      if (cloudBox) {
        cloudBox.innerHTML = d.has_cloud_credentials
          ? `<span style="color:var(--success); font-weight:600;">● Активно</span>`
          : `<span style="color:var(--text-muted);">Не задано</span>`;
      }

      const ewBox = document.getElementById('ewelink-status-box');
      if (ewBox) {
        ewBox.innerHTML = d.has_ewelink_credentials
          ? `<span style="color:var(--success); font-weight:600;">● Активно</span>`
          : `<span style="color:var(--text-muted);">Не задано</span>`;
      }
    }

    async function saveRemoteConfig() {
      const vps_url = document.getElementById('rem-vps-url').value.trim();
      const vps_secret = document.getElementById('rem-vps-secret').value.trim();
      const pwdRaw = document.getElementById('rem-password').value.trim();

      await safeFetchJson('/api/remote/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          vps_url, vps_secret, new_password: pwdRaw ? pwdRaw : null,
          stun_server: 'stun.cloudflare.com:3478', enabled: true
        })
      });

      document.getElementById('rem-password').value = '';
      document.getElementById('rem-vps-secret').value = '';
      showToast('Сохранено');
      await loadRemoteConfigUi();
    }

    async function syncOpenApi() {
      const region = document.getElementById('region').value;
      const access_id = document.getElementById('access_id').value.trim();
      const access_secret = document.getElementById('access_secret').value.trim();
      const statusEl = document.getElementById('sync-status');
      statusEl.innerHTML = 'Синхронизация...';
      const res = await safeFetchJson('/api/sync/openapi', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ region, access_id, access_secret })
      });
      statusEl.innerHTML = res.ok ? `Загружено: ${res.count}` : res.error;
      await loadAllData(false);
    }

    async function syncEwelink() {
      const region = document.getElementById('ew_region').value;
      const login = document.getElementById('ew_login').value.trim();
      const password = document.getElementById('ew_pass').value.trim();
      const statusEl = document.getElementById('ew-sync-status');
      if (!login || !password) return showToast('Введите логин и пароль');
      statusEl.innerHTML = 'Подключение...';
      const res = await safeFetchJson('/api/sync/ewelink', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ region, login, password })
      });
      statusEl.innerHTML = res.ok ? `Загружено: ${res.count}` : res.error;
      await loadAllData(false);
    }

    async function resetDb(scope) {
      if (!confirm('Подтвердить сброс?')) return;
      await safeFetchJson('/api/db/reset', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ scope })
      });
      await loadAllData(false);
    }

    function renderAll() {
      if (isInteracting) return;

      const profSelect = document.getElementById('profile-select');
      if (profSelect && profilesData.profiles && profilesData.profiles.length > 0) {
        profSelect.innerHTML = profilesData.profiles.map(p =>
          `<option value="${p.id}" ${p.id === profilesData.active ? 'selected' : ''}>${p.name}</option>`
        ).join('');
      }

      renderDashboardGroupsAndTiles();
      if (activeDeviceId) renderDeviceSheetContent();
      if (fsChartState) renderFullscreenChartModal();
      try { renderAutomationsTab(); } catch (_) {}
      try { renderCamerasTab(); } catch (_) {}
      try { renderRemoteSummaryBox(); } catch (_) {}
    }

    async function initAdaptiveSession() {
      if (IS_TAURI) {
        await refreshTauriRouteBadge();
      } else {
        try {
          const ping = await fetch('/api/ping').then(r => r.json());
          if (ping && ping.local_endpoint) {
            await probeOptimalRoute(ping.local_endpoint, ping.hub_id);
          }
        } catch (_) {}
      }
      await loadRemoteConfigUi();
      await loadAllData(false);
    }

    let knownLatestAutoLogKey = null;
    let knownCameraMotionTimes = {};
    let notificationsInitialized = false;

    async function requestSystemNotificationPermission() {
      try {
        if (IS_TAURI && window.__TAURI__.plugin) {
          await window.__TAURI__.core.invoke('plugin:notification|request_permission');
        } else if ('Notification' in window && Notification.permission === 'default') {
          await Notification.requestPermission();
        }
      } catch (_) {}
    }

    async function sendSystemNotification(title, body) {
      showToast(`${title}: ${body}`);
      try {
        if (IS_TAURI) {
          await window.__TAURI__.core.invoke('plugin:notification|notify', {
            options: { title, body }
          });
          return;
        }
      } catch (_) {}

      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          new Notification(title, { body });
        } else if (Notification.permission === 'default') {
          Notification.requestPermission().then(p => {
            if (p === 'granted') new Notification(title, { body });
          });
        }
      }
    }

    function checkAndFireNotifications() {
      const logs = automationsData.logs || [];
      const latestLog = logs[0];
      const latestLogKey = latestLog ? `${latestLog.time_str}|${latestLog.rule_name}|${latestLog.message}` : null;

      // При первом запуске запоминаем текущее состояние без спама старыми событиями
      if (!notificationsInitialized) {
        knownLatestAutoLogKey = latestLogKey;
        allDevices.forEach(d => {
          if (String(d.vendor).startsWith('Camera')) {
            const snap = cameraSnapshotsCache[d.device_id] || {};
            const mTime = snap.last_motion_time || (Array.isArray(d.status) && d.status.find(i => i.code === 'last_motion_time')?.value) || '';
            if (mTime && mTime !== '—') knownCameraMotionTimes[d.device_id] = mTime;
          }
        });
        notificationsInitialized = true;
        requestSystemNotificationPermission();
        return;
      }

      // 1. Новое срабатывание автоматики
      if (latestLog && latestLogKey !== knownLatestAutoLogKey) {
        knownLatestAutoLogKey = latestLogKey;
        sendSystemNotification(`⚡ ${latestLog.rule_name}`, latestLog.message);
      }

      // 2. Детекция движения на любой камере
      allDevices.forEach(d => {
        if (!String(d.vendor).startsWith('Camera')) return;
        const snap = cameraSnapshotsCache[d.device_id] || {};
        const isDetected = Boolean(snap.motion_detected ?? d.metadata?.motion_detected);
        const score = snap.motion_score ?? d.metadata?.motion_score ?? 0;
        const mTime = snap.last_motion_time
          || (Array.isArray(d.status) && d.status.find(i => i.code === 'last_motion_time')?.value)
          || '';

        if (isDetected && mTime && mTime !== '—' && knownCameraMotionTimes[d.device_id] !== mTime) {
          knownCameraMotionTimes[d.device_id] = mTime;
          sendSystemNotification(`📹 ${d.name || 'Камера'}`, `Движение в кадре (${score}%) в ${mTime}`);
        }
      });
    }

    async function loadAllData(manual = false) {
      try {
        const [prof, devs, auto] = await Promise.all([
          safeFetchJson('/api/profiles'),
          safeFetchJson('/api/devices'),
          safeFetchJson('/api/automations')
        ]);
        profilesData = prof;
        allDevices = devs;
        automationsData = auto;

        renderAll();

        checkAndFireNotifications();

        const smartDevs = allDevices.filter(d => !String(d.vendor).startsWith('Camera'));
        await Promise.all(smartDevs.map(async (d) => {
          try {
            historyCache[d.device_id] = await safeFetchJson(`/api/devices/${d.device_id}/history`);
          } catch (_) {}
        }));

        if (currentTab === 'cameras') await refreshAllCameras(false);
        if (activeDeviceId) renderDeviceSheetContent();
        if (fsChartState) renderFullscreenChartModal();
        if (manual) showToast('Обновлено');
      } catch (_) {}
    }

    initAdaptiveSession();
    setInterval(() => loadAllData(false), 5000);
  </script>
</body>
</html>
